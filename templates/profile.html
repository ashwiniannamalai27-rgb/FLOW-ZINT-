

{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="glass-card">

                <div class="text-center mb-4">

                    <i class="fa-solid fa-circle-user fa-5x text-primary"></i>

                    <h2 class="mt-3">Complete Your Profile</h2>

                    <p class="text-light">
                        Keep your financial information updated.
                    </p>

                </div>

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Age</label>

                            <input
                                type="number"
                                name="age"
                                class="form-control"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>City</label>

                            <input
                                type="text"
                                name="city"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Occupation</label>

                            <input
                                type="text"
                                name="occupation"
                                class="form-control"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Monthly Income</label>

                            <input
                                type="number"
                                name="monthly_income"
                                class="form-control"
                                required>

                        </div>

                    </div>

                    <button class="btn btn-primary w-100 mt-3">

                        Save Profile

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
