{% extends "base.html" %}

{% block title %}Financial Goals{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row">

        <!-- Add Goal -->

        <div class="col-lg-4">

            <div class="glass-card">

                <h2 class="mb-4">
                    🎯 Add Financial Goal
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label>Goal Name</label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Buy Car"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>Target Amount</label>

                        <input
                            type="number"
                            name="target_amount"
                            class="form-control"
                            placeholder="500000"
                            required>

                    </div>

                    <button class="btn btn-warning w-100">

                        <i class="fa-solid fa-plus"></i>

                        Add Goal

                    </button>

                </form>

            </div>

        </div>

        <!-- Goals List -->

        <div class="col-lg-8">

            <div class="glass-card">

                <h2 class="mb-4">
                    🏆 My Financial Goals
                </h2>

                {% if goals %}

                    {% for g in goals %}

                    <div class="goal-card mb-4">

                        <div class="d-flex justify-content-between">

                            <h5>{{ g.name }}</h5>

                            <span class="badge bg-warning text-dark">

                                ₹{{ g.target_amount }}

                            </span>

                        </div>

                        <div class="progress mt-3">

                            <div class="progress-bar bg-success"

                                 style="width:40%">

                                40%

                            </div>

                        </div>

                    </div>

                    {% endfor %}

                {% else %}

                <div class="text-center p-5">

                    <i class="fa-solid fa-bullseye fa-4x text-warning mb-3"></i>

                    <h4>No Goals Added</h4>

                </div>

                {% endif %}

            </div>

        </div>

    </div>

</div>

{% endblock %}
