{% extends "base.html" %}
{% block title %}Welcome{% endblock %}
{% block content %}

<h2>AI Financial Wellness Bot</h2>
<p style="text-align:center;">Take control of your money — track budgets, expenses, savings, and goals in one place.</p>

<div style="display:flex; gap:12px; margin-top:20px;">
    <a href="{{ url_for('auth.login') }}" style="flex:1;">
        <button type="button" style="width:100%;">Login</button>
    </a>
    <a href="{{ url_for('auth.register') }}" style="flex:1;">
        <button type="button" style="width:100%; background:#fff; color:#5b6ee8; border:1px solid #5b6ee8;">Register</button>
    </a>
</div>

{% endblock %}
